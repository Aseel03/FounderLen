[project]
name = "founderlens"
version = "0.1.0"
description = "A typed startup-finance engine"
readme = "README.md"
authors = [
    { name = "Asseel Isam", email = "asseelisam123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
founderlens = "founderlens:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
